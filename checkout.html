<div class="flex-1">
<p class="text-sm font-bold text-dark">Dingdang 钱包余额</p>
<p class="text-[10px] text-gray-500">当前余额: € 8,245.50</p>
</div>
<iconify-icon class="text-2xl text-primary opacity-0 peer-checked:opacity-100" icon="solar:check-circle-bold"></iconify-icon>
</div>
</label>
<label class="block cursor-pointer">

<div class="flex items-center gap-4 p-4 border-2 border-gray-100 rounded-8 peer-checked:border-primary peer-checked:bg-primary/5 transition-all">

</div>
<div class="flex-1">
<p class="text-sm font-bold text-dark">Visa / MasterCard</p>
<p class="text-[10px] text-gray-500">使用绑定的银行卡支付</p>
</div>
<iconify-icon class="text-2xl text-primary opacity-0 peer-checked:opacity-100" icon="solar:check-circle-bold"></iconify-icon>
</div>
</label>
<label class="block cursor-pointer">
<input class="hidden peer" name="pay_method" type="radio"/>
<div class="flex items-center gap-4 p-4 border-2 border-gray-100 rounded-8 peer-checked:border-primary peer-checked:bg-primary/5 transition-all">

</div>
<iconify-icon class="text-2xl text-primary opacity-0 peer-checked:opacity-100" icon="solar:check-circle-bold"></iconify-icon>
</div>

</div>
<!-- 底部按钮 -->
<div class="p-6 border-t border-gray-100">
<button class="w-full bg-primary text-dark font-bold py-4 rounded-full text-lg shadow-lg hover:shadow-xl active:scale-95 transition-all" onclick="this.innerHTML='支付中...'; setTimeout(()=&gt;location.href='dashboard.html', 1500);">
                立即支付 € 128.50
            </button>
<div class="mt-4 flex justify-center items-center gap-2">
<svg class="text-green-500" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em;flex:none" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" fill-rule="evenodd" d="M3.378 5.082C3 5.62 3 7.22 3 10.417v1.574c0 5.638 4.239 8.375 6.899 9.536c.721.315 1.082.473 2.101.473c1.02 0 1.38-.158 2.101-.473C16.761 20.365 21 17.63 21 11.991v-1.574c0-3.198 0-4.797-.378-5.335c-.377-.537-1.88-1.052-4.887-2.081l-.573-.196C13.595 2.268 12.812 2 12 2s-1.595.268-3.162.805L8.265 3c-3.007 1.03-4.51 1.545-4.887 2.082M15.06 10.5a.75.75 0 0 0-1.12-.999l-3.011 3.374l-.87-.974a.75.75 0 0 0-1.118 1l1.428 1.6a.75.75 0 0 0 1.119 0z" clip-rule="evenodd"/></svg>

</div>
<script src="assets/js/ui.js"></script>
<script>
/* wire:checkout.html */

document.addEventListener('DOMContentLoaded', function () {
    // 左上角返回
    var backBtn = document.querySelector('button.w-10.h-10.rounded-full');
    if (backBtn && !backBtn.dataset.wired) {
        backBtn.dataset.wired = 1;
        backBtn.addEventListener('click', function () { history.back(); });
    }
    // 支付按钮
    document.querySelectorAll('button').forEach(function (b) {
        var t = b.textContent.trim();
        if (b.dataset.wired) return;
        if (/确认支付|立即支付|支付 €|支付 ¥/.test(t)) {
            b.dataset.wired = 1;
            b.addEventListener('click', function () {
                var method = document.querySelector('input[name="pay_method"]:checked');
                var label = method ? method.closest('label').querySelector('.font-bold').textContent.trim() : 'Dingdang 钱包余额';
                b.disabled = true;
                b.textContent = '支付处理中...';
                setTimeout(function () {
                    DDUI.modal({
                        title: '支付成功', width: '380px',
                        body: '<div style="text-align:center;padding:8px 0">' +
                            '<div class="w-16 h-16 rounded-full bg-green-50 mx-auto flex items-center justify-center mb-4"><iconify-icon class="text-4xl text-green-500" icon="solar:check-circle-bold"></iconify-icon></div>' +
                            '<p style="font-size:14px;color:#4b5563">已通过 <b>' + label + '</b> 完成支付</p></div>',
                        actions: [{ text: '查看订单', type: 'primary', onClick: function (close) { location.href = 'pay-process.html'; } }]
                    });
                    b.disabled = false;
                    b.textContent = t;
                }, 1200);
            });
        }
    });
});

</script>
<script src="assets/js/i18n.js"></script>
