<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>员工登录 - 叮当支付内部运营后台</title>
<script src="../assets/vendor/tailwindcss.js"></script>
<script src="../assets/vendor/iconify-icon.min.js"></script>
<script>tailwind.config = { theme: { extend: { colors: { primary: '#FFD008', dark: '#382b1b' }, borderRadius: { '8': '8px' } } } }</script>
<link rel="stylesheet" href="../assets/css/apple.css" data-dd-apple="1"/>
<style>
.al-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,#3a2f1d 0%,#241d12 55%,#1a150c 100%)}
.al-card{width:100%;max-width:420px;background:rgba(255,255,255,.98);border-radius:var(--dd-r-xl);box-shadow:var(--dd-sh-3);padding:40px 36px;animation:dd-page-in .38s var(--dd-ease) both}
</style>
</head>
<body>
<div class="al-bg">
<div class="al-card">
<div class="flex items-center gap-3 mb-8">
<img alt="Dingdang Pay" class="h-11 w-auto" src="../assets/img/logo-h.png"/>
<div><p class="font-bold text-lg text-dark leading-tight">运营后台</p><p class="text-xs text-gray-400">Internal Staff Console</p></div>
</div>
<h1 class="text-2xl font-bold text-dark mb-1">员工登录</h1>
<p class="text-sm text-gray-500 mb-7">仅限授权员工使用，所有操作均会记录审计日志。</p>
<form id="f" novalidate class="space-y-4">
<div><label class="block text-sm font-medium text-gray-700 mb-1.5" for="em">企业邮箱</label>
<input id="em" value="admin@dingdangpay.com" class="w-full px-4 py-3 border border-gray-200 rounded-lg" type="email" required data-rule="email" data-msg="请输入有效的企业邮箱" placeholder="name@dingdangpay.com" autocomplete="username"/></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5" for="pw">密码</label>
<input id="pw" value="Admin@2026" class="w-full px-4 py-3 border border-gray-200 rounded-lg" type="password" required data-rule="min:6" data-msg="密码至少 6 位" placeholder="请输入密码" autocomplete="current-password"/></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1.5" for="otp">动态验证码（2FA）</label>
<input id="otp" value="888888" class="w-full px-4 py-3 border border-gray-200 rounded-lg font-mono tracking-[.4em]" inputmode="numeric" maxlength="6" required data-rule="min:6" data-msg="请输入 6 位动态验证码" placeholder="000000" autocomplete="one-time-code"/></div>
<button class="w-full bg-dark text-white py-3 rounded-lg font-bold mt-2" type="submit">登录后台</button>
</form>
<div class="flex justify-between text-xs text-gray-400 mt-6"><a class="hover:text-gray-700" href="../home.html">← 返回官网</a><span>忘记密码请联系 IT 管理员</span></div>
</div>
</div>
<script src="../assets/js/ui.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  if (!DDUI.validate(this)) return;
  var btn = this.querySelector('button[type=submit]');
  DDUI.busy(btn, 900, '登录成功').then(function () { location.href = 'index.html'; });
});
</script>
<script src="../assets/js/i18n.js"></script>
</body>
</html>
