<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录 - Dingdang Pay 叮当支付</title>
<script src="assets/vendor/tailwindcss.js"></script>
<script src="assets/vendor/iconify-icon.min.js"></script>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFD008',
                        dark: '#382b1b',
                        accent1: '#FF8106',
                        accent2: '#00B7EC'
                    },
                    borderRadius: { '8': '8px' }
                }
            }
        }
    </script>
<link rel="stylesheet" href="assets/css/apple.css" data-dd-apple="1"/>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full">
<div class="text-center mb-10">
<a class="inline-flex items-center gap-2 mb-6" href="home.html"><img alt="Dingdang Pay" class="h-12 w-auto" src="assets/img/logo-h.png"/></a>
<h2 class="text-2xl font-bold text-dark">欢迎回来</h2>
<p class="text-gray-500 mt-2">登录您的跨境数字钱包</p>
</div>
<div class="bg-white p-8 rounded-8 shadow-xl border border-gray-100">
<form class="space-y-6" onsubmit="return doLogin(event)">
<div>
<label class="block text-sm font-bold text-dark mb-2">邮箱 / 手机号</label>
<div class="relative">
<span class="absolute left-4 top-3.5 text-gray-400">
<iconify-icon icon="solar:user-bold"></iconify-icon>
</span>
<input class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-8 focus:outline-none focus:border-accent2 transition-colors" id="login-account" placeholder="example@email.com" type="text" value="xiaohan@dingdangpay.com"/>
</div>
<p class="text-xs text-red-500 mt-1 hidden" id="login-account-err">请输入邮箱或手机号</p>
</div>
<div>
<div class="flex justify-between mb-2">
<label class="text-sm font-bold text-dark">登录密码</label>
<a class="text-sm text-accent2 hover:underline cursor-pointer" onclick="openResetPwd()">忘记密码？</a>
</div>
<div class="relative">
<span class="absolute left-4 top-3.5 text-gray-400">
<iconify-icon icon="solar:lock-password-bold"></iconify-icon>
</span>
<input class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-8 focus:outline-none focus:border-accent2 transition-colors" id="login-password" placeholder="请输入密码" type="password" value="Dingdang@2026"/>
</div>
<p class="text-xs text-red-500 mt-1 hidden" id="login-password-err">请输入登录密码</p>
</div>
<button class="w-full bg-primary text-dark font-bold py-4 rounded-8 hover:shadow-lg transition-all active:scale-[0.98]" id="login-btn" type="submit">
                    立即登录
                </button>
</form>
<div class="mt-5 rounded-8 px-4 py-3 text-xs leading-relaxed" style="background:rgba(255,208,8,.14);color:#8a6d00;border:1px solid rgba(255,208,8,.35)">
演示账户：<b>xiaohan@dingdangpay.com</b>　密码：<b>Dingdang@2026</b>
</div>
<div class="mt-8 pt-8 border-t border-gray-100">
<p class="text-center text-sm text-gray-500">
                    还没有账户？ <a class="text-accent2 font-bold hover:underline" href="register.html?demo=1">立即注册</a>
</p>
</div>
</div>
<div class="mt-8 text-center text-xs text-gray-400">
<p>登录即代表您同意我们的 <a class="underline" href="terms.html">服务条款</a> 和 <a class="underline" href="privacy.html">隐私政策</a></p>
</div>
</div>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script>
function doLogin(e) {
    e.preventDefault();
    var acc = document.getElementById('login-account').value.trim();
    var pwd = document.getElementById('login-password').value;
    document.getElementById('login-account-err').classList.toggle('hidden', !!acc);
    document.getElementById('login-password-err').classList.toggle('hidden', !!pwd);
    if (!acc || !pwd) return false;
    var btn = document.getElementById('login-btn');
    DDUI.busy(btn, DDAuth.login(acc, pwd).then(function (ok) {
        if (!ok) throw new Error('账户或密码错误，请重新输入');
    }), '登录成功，请完成安全验证').then(function () {
        DD2FA.require('登录', function () { location.href = DDAuth.nextUrl(); });
    }).catch(function () { /* 错误提示已由 busy 展示 */ });
    return false;
}
function openResetPwd() {
    DDUI.modal({
        title: '重置登录密码',
        body: '<div class="ddui-field"><label class="ddui-label">注册邮箱 / 手机号</label>' +
              '<input class="ddui-input" id="rp-account" placeholder="example@email.com"/>' +
              '<p class="ddui-err" id="rp-err" style="display:none">请输入注册时使用的邮箱或手机号</p></div>' +
              '<p style="font-size:12px;color:#9ca3af;line-height:1.6">重置链接 / 验证码将发送至您的绑定邮箱或手机，10 分钟内有效。</p>',
        actions: [
            { text: '取消' },
            { text: '发送重置链接', type: 'primary', onClick: function (close, body) {
                var v = body.querySelector('#rp-account').value.trim();
                body.querySelector('#rp-err').style.display = v ? 'none' : 'block';
                if (!v) return;
                close();
                DDUI.toast('重置链接已发送，请查收', 'success');
            } }
        ]
    });
}
</script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/tx-2fa.js"></script>
</body>
</html>
